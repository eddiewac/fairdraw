[build]
  publish = "."
  functions = "netlify/functions"

# The Kaspa SDK loads an 11MB .wasm from disk at runtime. Bundling relocates it
# and breaks that path, so ship the function unbundled and include the folder
# explicitly. Paths in included_files are relative to the repo root, which is
# why the function looks for the SDK in several places.
[functions]
  node_bundler = "none"
  included_files = [
    "netlify/functions/kaspa/**",
    "kaspa/**"
  ]
